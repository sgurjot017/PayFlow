services:
  payflow-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: ${PAYFLOW_DATABASE_USER:-payflow}
      POSTGRES_PASSWORD: ${PAYFLOW_DATABASE_PASSWORD:?Set PAYFLOW_DATABASE_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - payflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYFLOW_DATABASE_USER:-payflow} -d payflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payflow-postgres-data:
