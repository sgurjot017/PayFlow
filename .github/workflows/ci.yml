name: PayFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: payflow_test
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYFLOW_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/payflow_test
      PAYFLOW_TEST_DATABASE_USER: payflow
      PAYFLOW_TEST_DATABASE_PASSWORD: payflow-test-only

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run tests
        run: ./gradlew :shared:allTests :androidApp:testDebugUnitTest :backend:test
